name: renewal build check

# 리뉴얼 브랜치 전용 빌드 검사. 배포 단계와 운영 시크릿은 없다.
# 테스트는 DB와 환경변수가 필요해 이 단계에서 제외했다.
on:
  push:
    branches:
      - codex/renewal
  pull_request:
    branches:
      - codex/renewal
  workflow_dispatch:

jobs:
  build:
    name: Compile and package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Package without tests
        run: ./mvnw -B clean package -DskipTests
